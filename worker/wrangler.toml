name = "shouarchive-path"
main = "worker-subdomain.js"
compatibility_date = "2026-09-01"

# 서브도메인 전체를 이 Worker 가 받는다 (DNS · 인증서는 Cloudflare 가 만든다)
routes = [
  { pattern = "shouarchive.beakbig.com", custom_domain = true },
]

[vars]
# 사이트 원본. GitHub Pages 대신 Cloudflare Pages 프로젝트를 쓰려면
# "https://<프로젝트>.pages.dev" 로 바꾸면 된다 (경로 접두어 없이).
UPSTREAM = "https://beakbig.github.io/shouarchive-site"
